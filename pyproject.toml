[project]
name = "suntimes-streamlit"
version = "0.1.0"
description = ""
authors = [
    {name = "GreyAudron",email = "mikhail.schee@mail.utoronto.ca"}
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "streamlit (>=1.50.0,<2.0.0)",
    "suncalc (>=0.1.3,<0.2.0)",
    "timezonefinder (>=8.1.0,<9.0.0)",
    "altair (<6)"
]

[tool.poetry]
packages = [{include = "suntimes_streamlit", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
